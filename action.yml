name: 'Backport Action'
description: 'Backport merged pull requests to other branches via labels'
inputs:
  github_token:
    description: The access token that will be used to create the backport pull requests and perform other operations
    required: true
  auto_backport_label_prefix:
    description: Backport a pull request to specific branches based on the labels applied
    required: false
  repo_fork_owner:
    description: The owner of the repo where the backport branch will be pushed to. Defaults to the current repo
    required: false
  copy_source_pr_reviewers:
    description: Boolean, if set to true the reviewers of the source pull request will be added to the backport pull requests
    required: false
    default: false
  ignore_error_codes:
    description: >
      Comma-separated list of BackportError codes that should NOT fail the action.
      By default, merge-conflict-exception and no-branches-exception are ignored
      because merge conflicts are already surfaced via PR status comments,
      and no-branches fires on every merged PR without backport labels.
      Set to "" (empty string) to fail on all errors.
      See https://github.com/sorenlouv/backport/blob/main/src/lib/backport-error.ts
      for a full list of valid error codes.
    required: false
    default: 'merge-conflict-exception,no-branches-exception'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: git-branch
  color: green
